<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>中秋祝福</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <style>
    :root {
      --pink: #ff9aae;
      --deep: #16070d;
      --wine: #3d1824;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button {
      font: inherit;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #fff;
      background: #000;
      transition: opacity .6s ease, visibility .6s ease;
    }

    .intro.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro p {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 1px 5px #fff;
    }

    .envelope {
      width: 116px;
      height: 68px;
      padding: 0;
      border: 0;
      position: relative;
      cursor: pointer;
      background: linear-gradient(145deg, #fff 0 49%, #eaded5 50% 100%);
      box-shadow: 0 0 13px rgba(255, 255, 255, .85);
      transition: transform .2s ease;
    }

    .envelope:hover { transform: scale(1.06); }

    .envelope::before,
    .envelope::after {
      content: "";
      position: absolute;
      inset: 0;
      border-style: solid;
      pointer-events: none;
    }

    .envelope::before {
      border-width: 1px 1px 0 0;
      border-color: #d1beb4;
      clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    }

    .envelope::after {
      border-width: 0 1px 1px;
      border-color: #d1beb4;
      clip-path: polygon(0 100%, 50% 47%, 100% 100%);
    }

    .heart {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 22px;
      width: 28px;
      height: 24px;
      transform: translateX(-50%) rotate(-45deg);
      border-radius: 5px 0 5px 5px;
      background: #f04f56;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 24px;
      border-radius: 50%;
      background: #f04f56;
    }

    .heart::before { top: -14px; left: 0; }
    .heart::after { top: 0; left: 14px; }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--pink);
      background:
        radial-gradient(circle at 52% 48%, rgba(255, 89, 123, .2), transparent 22%),
        radial-gradient(circle at 25% 35%, rgba(111, 30, 52, .55), transparent 35%),
        linear-gradient(135deg, #16070d, #4a1c29 48%, #1a080e);
      opacity: 0;
      transition: opacity .8s ease;
    }

    .scene.is-visible { opacity: 1; }

    .scene::before {
      content: "";
      position: absolute;
      inset: -30%;
      opacity: .33;
      background:
        radial-gradient(ellipse at 30% 40%, #8d3a51 0 4%, transparent 5%),
        radial-gradient(ellipse at 72% 25%, #8d3a51 0 5%, transparent 6%),
        radial-gradient(ellipse at 62% 78%, #8d3a51 0 6%, transparent 7%);
      filter: blur(17px);
      transform: rotate(-18deg);
    }

    .barrage {
      position: absolute;
      inset: 0;
      perspective: 900px;
      color: rgba(255, 159, 177, .78);
      font-size: clamp(18px, 4.2vw, 32px);
      text-shadow: 0 0 8px rgba(255, 109, 142, .28);
      user-select: none;
    }

    .barrage span {
      position: absolute;
      left: var(--x);
      bottom: -15%;
      white-space: nowrap;
      width: max-content;
      animation: riseText var(--duration) linear infinite;
      animation-delay: var(--delay);
      will-change: transform;
    }

    .barrage span:nth-child(1) { --x: -18%; --duration: 8s; --delay: -8s; }
    .barrage span:nth-child(2) { --x: 39%; --duration: 10s; --delay: -13s; }
    .barrage span:nth-child(3) { --x: 8%; --duration: 7s; --delay: -4s; font-size: 1.6em; color: #ff8fa6; }
    .barrage span:nth-child(4) { --x: 55%; --duration: 9s; --delay: -10s; }
    .barrage span:nth-child(5) { --x: -25%; --duration: 9s; --delay: -16s; font-size: 1.3em; }
    .barrage span:nth-child(6) { --x: 25%; --duration: 11s; --delay: -7s; }
    .barrage span:nth-child(7) { --x: 66%; --duration: 7s; --delay: -11s; }
    .barrage span:nth-child(8) { --x: 0%; --duration: 9s; --delay: -2s; }
    .barrage span:nth-child(9) { --x: 48%; --duration: 8s; --delay: -6s; }
    .barrage span:nth-child(10) { --x: -12%; --duration: 11s; --delay: -17s; }
    .barrage span:nth-child(11) { --x: 72%; --duration: 9s; --delay: -9s; }
    .barrage span:nth-child(12) { --x: 18%; --duration: 8s; --delay: -12s; }
    .barrage span:nth-child(13) { --x: 58%; --duration: 12s; --delay: -20s; }
    .barrage span:nth-child(14) { --x: -30%; --duration: 9s; --delay: -5s; }
    .barrage span:nth-child(15) { --x: 33%; --duration: 10s; --delay: -14s; }
    .barrage span:nth-child(16) { --x: 80%; --duration: 7s; --delay: -1s; }

    @keyframes riseText {
      0% {
        opacity: .45;
        transform: translate3d(0, 10vh, -120px) rotate(-3deg) scale(.78);
      }
      12% { opacity: .75; }
      46% {
        opacity: 1;
        transform: translate3d(3vw, 0, 80px) rotate(2deg) scale(1.08);
      }
      78% { opacity: .78; }
      100% {
        opacity: .4;
        transform: translate3d(-4vw, -112vh, -120px) rotate(-5deg) scale(.76);
      }
    }

    .message {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 100%;
      transform: translate(-50%, -50%);
      color: #ff9db0;
      font-size: clamp(34px, 8vw, 76px);
      font-weight: 400;
      text-align: center;
      text-shadow: 0 0 11px rgba(255, 86, 125, .9);
      animation: messageFloat 4.5s ease-in-out infinite alternate;
    }

    @keyframes messageFloat {
      from {
        opacity: .72;
        transform: translate(-50%, -50%) scale(.95);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    .footer {
      position: absolute;
      z-index: 1;
      bottom: 12px;
      width: 100%;
      color: rgba(255, 191, 201, .7);
      text-align: center;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="intro" id="intro" aria-label="打开中秋祝福">
    <p>🏮 您有一条中秋祝福，请点击查看 🏮</p>

    <div class="theme-picker" aria-label="选择背景风格">
      <button class="theme-btn" type="button" data-theme="classic">经典版</button>
      <button class="theme-btn is-active" type="button" data-theme="warm">暖色版</button>
    </div>

    <button class="envelope" id="openButton" aria-label="点击查看祝福">
      <span class="heart"></span>
    </button>
  </section>

  <main class="scene" id="scene">
    <div class="barrage" id="barrage" aria-hidden="true">
    </div>
  </main>

  <div class="watermark" aria-label="水印">云顶科技监制 · 制作人：小白</div>
  <div class="toast" id="toast" aria-live="polite">请注意后面有彩蛋，请耐心观看</div>

  <div class="egg-overlay" id="eggOverlay" aria-live="polite">
    <video id="eggVideo" playsinline webkit-playsinline muted preload="auto" autoplay>
      <source src="https://default-u2dit96.cdn.7caiyun.com/%E5%BD%A9%E8%9B%8B.mp4" type="video/mp4">
    </video>
  </div>

  <audio id="bgm" src="MP3/李荣浩-天生.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
